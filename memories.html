<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memories ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts" aria-hidden="true">
        <span>❤️</span><span>💗</span><span>💕</span><span>💖</span>
        <span>💗</span><span>❤️</span><span>💕</span><span>💞</span>
    </div>

    <main class="memories">
        <p class="small-text">OUR LITTLE WORLD</p>
        <h1>Our Memories 📸</h1>
        <p class="memory-text">Different places, different days, but still us. ❤️</p>

        <div class="gallery">
            <div class="photo">
                <button class="photo-view" type="button" aria-label="View photo: Us" data-caption="Us ❤️">
                    <img src="f45a0f33-6721-474c-8d73-1665b9144b93.jpg" alt="Our memory">
                </button>
                <span class="photo-placeholder" aria-hidden="true" hidden>♡<small>A little piece of us</small></span>
                <span>Us ❤️</span>
            </div>
            <div class="photo">
                <button class="photo-view" type="button" aria-label="View photo: My favorite person" data-caption="My favorite person 💗">
                    <img src="2babba98-69b6-4b0b-8e13-4343523f0bb8.jpg" alt="Our memory">
                </button>
                <span class="photo-placeholder" aria-hidden="true" hidden>♡<small>My favorite moment</small></span>
                <span>My favorite person 💗</span>
            </div>
            <div class="photo">
                <button class="photo-view" type="button" aria-label="View photo: My happy place" data-caption="My happy place 🥹">
                    <img src="f2f4e388-74cc-43ec-a702-1cacf27a7a13.jpg" alt="Our memory">
                </button>
                <span class="photo-placeholder" aria-hidden="true" hidden>♡<small>My happy place</small></span>
                <span>My happy place 🥹</span>
            </div>
            <div class="photo">
                <button class="photo-view" type="button" aria-label="View photo: Always us" data-caption="Always us 💕">
                    <img src="6d114da7-c4dc-4622-9747-cdec7e1051fc.jpg" alt="Our memory">
                </button>
                <span class="photo-placeholder" aria-hidden="true" hidden>♡<small>Always us</small></span>
                <span>Always us 💕</span>
            </div>
        </div>

        <nav class="page-links" aria-label="More pages">
            <a class="button-primary" href="letter.html" target="slides">💌 Read my letter</a>
            <a class="button-secondary" href="distance.html" target="slides">💗 A little love note</a>
            <a class="button-secondary" href="home.html" target="slides">⌂ Home</a>
        </nav>
    </main>

    <dialog class="photo-viewer" id="photo-viewer" aria-labelledby="photo-caption">
        <div class="photo-viewer-heading">
            <p id="photo-caption"></p>
            <button class="photo-viewer-close" type="button" aria-label="Close photo">×</button>
        </div>
        <img class="photo-viewer-image" alt="">
    </dialog>

    <script>
        const viewer = document.getElementById("photo-viewer");
        const viewerImage = viewer.querySelector(".photo-viewer-image");
        const viewerCaption = document.getElementById("photo-caption");

        document.querySelectorAll(".photo-view").forEach((button) => {
            const image = button.querySelector("img");

            button.addEventListener("click", () => {
                viewerImage.src = image.currentSrc || image.src;
                viewerImage.alt = image.alt;
                viewerCaption.textContent = button.dataset.caption;
                viewer.showModal();
            });

            image.addEventListener("error", () => {
                button.hidden = true;
                button.nextElementSibling.hidden = false;
            });
        });

        viewer.querySelector(".photo-viewer-close").addEventListener("click", () => viewer.close());
        viewer.addEventListener("click", (event) => {
            if (event.target === viewer) viewer.close();
        });
    </script>
</body>
</html>
